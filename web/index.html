<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="board-title" id="board-title">Calendar</h1>
    <div class="status">
      <span class="offline" id="offline" hidden>Offline</span>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <div class="layout">
    <!-- Left column: this month, next month, then the upcoming events. -->
    <aside class="sidebar">
      <section class="month" id="month-0"></section>
      <section class="month" id="month-1"></section>
      <ol class="agenda" id="agenda"></ol>
    </aside>

    <div class="main">
      <main class="stage" id="stage" aria-live="polite"></main>

      <!-- Shown only when display.qr_url is set in config.json. -->
      <aside class="qr" id="qr" hidden>
        <div class="qr-code" id="qr-code"></div>
        <p class="qr-text" id="qr-text"></p>
      </aside>
    </div>
  </div>

  <!--
    One event card. Elements with data-field get filled in by app.js:
    relative, weekday, day, month, calendar, title, time, location,
    description, nowBadge. Empty fields are hidden. Move or restyle freely.
  -->
  <template id="event-template">
    <article class="event">
      <div class="date">
        <div class="relative" data-field="relative"></div>
        <div class="weekday" data-field="weekday"></div>
        <div class="day" data-field="day"></div>
        <div class="month-name" data-field="month"></div>
      </div>
      <div class="details">
        <div class="meta">
          <span class="chip"></span>
          <span class="calendar" data-field="calendar"></span>
          <span class="now-badge" data-field="nowBadge"></span>
        </div>
        <h2 class="title" data-field="title"></h2>
        <p class="time" data-field="time"></p>
        <p class="location" data-field="location"></p>
        <p class="description" data-field="description"></p>
      </div>
    </article>
  </template>

  <template id="empty-template">
    <article class="empty">
      <p class="empty-title">No upcoming events</p>
      <p class="empty-sub">New events will show up here automatically.</p>
    </article>
  </template>

  <script src="vendor/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
