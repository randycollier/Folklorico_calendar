<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="card" hidden>
    <section class="date">
      <div id="relative"></div>
      <div id="weekday"></div>
      <div id="day"></div>
      <div id="month"></div>
    </section>
    <section class="info">
      <div id="calendar"></div>
      <h1 id="title"></h1>
      <div id="time"></div>
      <div id="location"></div>
      <p id="description"></p>
    </section>
  </main>

  <div id="empty">Loading calendar…</div>
  <div id="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
